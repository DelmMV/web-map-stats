          nullable: false
        distanceKm:
          type: number
          format: double
        color:
          type: string
        routingProfile:
          type: string
        difficulty:
          type: string
          nullable: true
        surfaceTypes:
          type: array
          items:
            type: string
          description: Типы покрытий
        visibility:
          type: string
          enum: [public, private]
        createdAt:
          type: string
          format: date-time
        startPoint:
          $ref: '#/components/schemas/Waypoint'
        bbox:
          $ref: '#/components/schemas/BoundingBox'
        isOrphaned:
          type: boolean
          description: true, если автор маршрута отсутствует в системе

    SharedRouteDetail:
      type: object
      properties:
        sharedId:
          type: string
        authorId:
          type: integer
          nullable: false
        route:
          allOf:
            - $ref: '#/components/schemas/SharedRouteInput'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        isOrphaned:
          type: boolean
          description: true, если автор маршрута отсутствует в системе

    MessageResponse:
      type: object
      properties:
        message:
          type: string

    PeriodEnum:
      type: string
      enum:
        - this_week
        - last_week
        - this_month
        - last_month

    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
          nullable: true

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Требуется авторизация или неверные креды
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Ресурс уже существует
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  /api/users/{userId}/routes/{routeId}/share:
    post:
      tags: [Profiles]
      summary: Создать короткую ссылку на маршрут из профиля
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
        - in: path
          name: routeId
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Ссылка создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteShare'
        '200':
          description: Ссылка уже существовала и возвращена повторно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteShare'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/shared-routes:
    get:
      tags: [Profiles]
      summary: Каталог публичных маршрутов
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
        - in: query
          name: authorId
          schema:
            type: integer
          description: Вернуть только маршруты конкретного автора
        - in: query
          name: bbox
          schema:
            type: string
          description: 'Границы просмотра: minLon,minLat,maxLon,maxLat'
        - in: query
          name: visibility
          schema:
            type: string
            enum: [public, private]
          description: Фильтр по видимости (по умолчанию public)
      responses:
        '200':
          description: Каталог маршрутов
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SharedRouteSummary'
                  limit:
                    type: integer
                  offset:
                    type: integer
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Profiles]
      summary: Сохранить произвольный маршрут и получить короткий ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SharedRouteInput'
      responses:
        '201':
          description: Маршрут сохранён
          content:
            application/json:
              schema:
                type: object
                properties:
                  sharedId:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/shared-routes/{sharedId}:
    get:
      tags: [Profiles]
      summary: Получить маршрут по короткому ID
      parameters:
        - in: path
          name: sharedId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Сохранённый маршрут
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedRouteDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Profiles]
      summary: Удалить сохранённый маршрут
      parameters:
        - in: path
          name: sharedId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Удалено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
