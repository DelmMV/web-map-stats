openapi: 3.0.3
info:
  title: Geolocation & Stats API
  version: 1.0.0
  description: |
    Бэкенд для геолокации, зарядных станций, тепловых карт и статистики по передвижениям пользователей.

servers:
  - url: http://localhost:5001
    description: Local server

tags:
  - name: Users
    description: Активные пользователи и статистика
  - name: Avatars
    description: Безопасная выдача аватаров
  - name: ChargingStations
    description: Зарядные станции
  - name: Heatmap
    description: Тепловые карты
  - name: Routes
    description: Маршруты пользователей
  - name: Stats
    description: Сводная статистика и топы
  - name: Categories
    description: Север/юг категории по дистанциям
  - name: Workshops
    description: Мастерские
  - name: Profiles
    description: Профили пользователей и сохранённые маршруты
  - name: Auth
    description: Регистрация и аутентификация пользователей

paths:
  /api/active-users:
    get:
      tags: [Users]
      summary: Получить активных пользователей
      description: >
        Возвращает пользователей, активных за последние 10 минут, с их последней геопозицией и средней скоростью за последние 120 секунд.  
        URL аватаров шифруются и ведут на `/secure-avatar/{encryptedUrl}`.
      responses:
        '200':
          description: Список активных пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ActiveUser'
        '500':
          $ref: '#/components/responses/InternalError'

  /secure-avatar/{encryptedUrl}:
    get:
      tags: [Avatars]
      summary: Проксирование зашифрованного URL аватара
      description: |
        Дешифрует URL аватарки, делает запрос к исходному URL и проксирует бинарный ответ.
      parameters:
        - in: path
          name: encryptedUrl
          required: true
          schema:
            type: string
          description: Зашифрованный URL аватара (формат `iv:encryptedHex`).
      responses:
        '200':
          description: Аватар (изображение)
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '500':
          description: Ошибка при получении аватара

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Зарегистрировать нового пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, email, password]
              properties:
                userId:
                  type: integer
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                  description: Минимум 8 символов
                username:
                  type: string
                city:
                  type: string
      responses:
        '201':
          description: Пользователь зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Выполнить вход
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisteredUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/{userId}/profile:
    get:
      tags: [Profiles]
      summary: Получить профиль пользователя
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
          description: ID пользователя
      responses:
        '200':
          description: Профиль с сохранёнными маршрутами
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Profiles]
      summary: Создать или обновить профиль пользователя
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
          description: ID пользователя
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                avatarUrl:
                  type: string
                  format: uri
                city:
                  type: string
                wheelModel:
                  type: string
      responses:
        '200':
          description: Актуальный профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/{userId}/routes:
    get:
      tags: [Profiles]
      summary: Список сохранённых маршрутов пользователя
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
          description: ID пользователя
      responses:
        '200':
          description: Сохранённые маршруты
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SavedRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Profiles]
      summary: Сохранить новый маршрут на карте
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
          description: ID пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, waypoints]
              properties:
                name:
                  type: string
                description:
                  type: string
                mapProvider:
                  type: string
                color:
                  type: string
                  example: "#4c6ef5"
                difficulty:
                  type: string
                  description: Сложность маршрута (произвольная метка)
                surfaceTypes:
                  type: array
                  description: Типы покрытий по маршруту
                  items:
                    type: string
                waypoints:
                  type: array
                  minItems: 2
                  items:
                    $ref: '#/components/schemas/Waypoint'
                estimatedDurationMinutes:
                  type: number
                  description: Готовая оценка длительности маршрута
                averageSpeedKmh:
                  type: number
                  description: Средняя скорость, по которой можно оценить длительность
      responses:
        '201':
          description: Маршрут сохранён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedRoute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/{userId}/routes/{routeId}:
    delete:
      tags: [Profiles]
      summary: Удалить сохранённый маршрут
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
          description: ID пользователя
        - in: path
          name: routeId
          required: true
          schema:
            type: string
          description: ID сохранённого маршрута (возвращается при POST)
      responses:
        '200':
          description: Маршрут удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/{userId}/avatar:
    post:
      tags: [Profiles]
      summary: Загрузить новый аватар пользователя
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
          description: ID пользователя
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
                  description: Файл изображения до 5 МБ
      responses:
        '200':
          description: Аватар обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Profiles]
      summary: Удалить текущий аватар пользователя
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
          description: ID пользователя
      responses:
        '200':
          description: Аватар удалён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/charging-stations:
    get:
      tags: [ChargingStations]
      summary: Список зарядных станций
      responses:
        '200':
          description: Список всех зарядных станций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChargingStation'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [ChargingStations]
      summary: Создать зарядную станцию
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                latitude:
                  type: string
                  example: "59.9505"
                longitude:
                  type: string
                  example: "30.3163"
                comment:
                  type: string
                userId:
                  type: string
                  description: ID пользователя (будет преобразован в Number)
                addedBy:
                  type: string
                  description: JSON-строка с информацией о пользователе
                addedAt:
                  type: string
                  format: date-time
                is24Hours:
                  type: string
                  enum: ["true", "false"]
                markerType:
                  type: string
                photo:
                  type: string
                  format: binary
                  description: Файл изображения (опционально, до 10 МБ)
      responses:
        '201':
          description: Станция создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChargingStation'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/charging-stations/{id}:
    put:
      tags: [ChargingStations]
      summary: Обновить зарядную станцию
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID станции (MongoDB ObjectId)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                latitude:
                  type: string
                longitude:
                  type: string
                comment:
                  type: string
                is24Hours:
                  type: string
                  enum: ["true", "false"]
                markerType:
                  type: string
                photo:
                  type: string
                  format: binary
                  description: Новое фото (опционально)
      responses:
        '200':
          description: Успешное обновление станции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [ChargingStations]
      summary: Удалить зарядную станцию
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Успешное удаление
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/charging-stations/{id}/like/{userId}:
    post:
      tags: [ChargingStations]
      summary: Поставить/снять лайк у станции
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Статус лайка обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/charging-stations/{id}/dislike/{userId}:
    post:
      tags: [ChargingStations]
      summary: Поставить/снять дизлайк у станции
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Статус дизлайка обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/charging-stations/{id}/like-status/{userId}:
    get:
      tags: [ChargingStations]
      summary: Получить статус лайка/дизлайка станции
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: path
          name: userId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Статус лайка/дизлайка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LikeStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/monthly-heatmap/{year}/{month}:
    get:
      tags: [Heatmap]
      summary: Месячная тепловая карта
      parameters:
        - in: path
          name: year
          required: true
          schema: { type: integer }
        - in: path
          name: month
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: Тепловая карта за месяц
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HeatmapPoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/yearly-heatmap/{year}:
    get:
      tags: [Heatmap]
      summary: Годовая тепловая карта
      parameters:
        - in: path
          name: year
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Сводная тепловая карта года
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HeatmapPoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/heatmap:
    get:
      tags: [Heatmap]
      summary: Тепловая карта за произвольный период
      parameters:
        - in: query
          name: startDate
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Тепловая карта за период
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HeatmapPoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/route/{userId}:
    get:
      tags: [Routes]
      summary: Маршрут пользователя
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: integer }
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Маршрут пользователя
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoutePoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/top-users/this_week:
    get:
      tags: [Stats]
      summary: Топ пользователей за текущую неделю
      responses:
        '200':
          description: Список топ-пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopUser'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/top-users/last_week:
    get:
      tags: [Stats]
      summary: Топ пользователей за прошлую неделю
      responses:
        '200':
          description: Список топ-пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopUser'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/top-users/this_month:
    get:
      tags: [Stats]
      summary: Топ пользователей за текущий месяц
      responses:
        '200':
          description: Список топ-пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopUser'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/top-users/last_month:
    get:
      tags: [Stats]
      summary: Топ пользователей за прошлый месяц
      responses:
        '200':
          description: Список топ-пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopUser'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/user-stats/week/{userId}:
    get:
      tags: [Stats]
      summary: Недельная статистика пользователя
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Подробная статистика за текущую неделю
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWeeklyStats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/total-distance/{period}:
    get:
      tags: [Stats]
      summary: Общая дистанция всех пользователей за период
      parameters:
        - in: path
          name: period
          required: true
          schema:
            $ref: '#/components/schemas/PeriodEnum'
      responses:
        '200':
          description: Общая дистанция
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotalDistanceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/top-sessions/{period}:
    get:
      tags: [Stats]
      summary: Топ сессий по дистанции за период
      parameters:
        - in: path
          name: period
          required: true
          schema:
            $ref: '#/components/schemas/PeriodEnum'
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Топ сессий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopSessionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/top-daily-distances/{period}:
    get:
      tags: [Stats]
      summary: Топ дневных дистанций за период
      parameters:
        - in: path
          name: period
          required: true
          schema:
            $ref: '#/components/schemas/PeriodEnum'
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Топ дневных дистанций
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopDailyDistancesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/user-category-by-distance/{userId}:
    get:
      tags: [Categories]
      summary: Категория пользователя (north/south) по дистанции
      parameters:
        - in: path
          name: userId
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Категория и распределение дистанции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCategoryByDistance'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/total-category-by-distance/{period}:
    get:
      tags: [Categories]
      summary: Общая статистика north/south по дистанции за период
      parameters:
        - in: path
          name: period
          required: true
          schema:
            $ref: '#/components/schemas/PeriodEnum'
      responses:
        '200':
          description: Общая категория и распределение дистанции
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotalCategoryByDistance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/workshops:
    get:
      tags: [Workshops]
      summary: Список мастерских
      responses:
        '200':
          description: Мастерские (БД feedback_bot.workshops)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Workshop'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    ActiveUser:
      type: object
      properties:
        userId:
          type: integer
        lastActive:
          type: integer
          description: Unix timestamp (секунды)
        latitude:
          type: number
